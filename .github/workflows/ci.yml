name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 语法检查（全部 py 文件）
        run: |
          fail=0
          for f in $(find . -name '*.py' -not -path './.git/*'); do
            python -m py_compile "$f" || fail=1
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "所有 Python 文件语法通过"

      - name: Node 语法检查（client.js / index.js）
        run: |
          node --check client.js
          node --check index.js
          echo "所有 Node 文件语法通过"

      - name: 安全检查：敏感配置文件未被提交
        run: |
          # 只检查「哪些文件被 git 跟踪」，不比对任何真实凭据内容
          if git ls-files | grep -E 'campus-net\.json$|campus-net\.state\.json$'; then
            echo "敏感配置文件 campus-net.json / state.json 被提交了，必须移除"
            exit 1
          fi
          echo "敏感配置文件未被提交"

      - name: 安装依赖（PyYAML）
        run: python -m pip install --quiet pyyaml

      - name: YAML 检查（cordis.patch.yml）
        run: |
          python - <<'PY'
          import sys
          import yaml

          class Loader(yaml.SafeLoader):
              pass

          # Cordis 的 patch 方言里有 !!js 表达式（Loader 在运行时求值）。
          # PyYAML 不认这个 tag，直接 safe_load 会报
          # "could not determine a constructor for the tag 'tag:yaml.org,2002:js'"。
          # 注册一个「当字符串」的构造器：结构照样校验，表达式不求值。
          def _js(loader, node):
              return '!!js:' + str(loader.construct_scalar(node))

          Loader.add_constructor('tag:yaml.org,2002:js', _js)
          Loader.add_multi_constructor('!', lambda l, suffix, n: l.construct_scalar(n))

          try:
              doc = yaml.load(open('cordis.patch.yml', encoding='utf-8'), Loader=Loader)
          except yaml.YAMLError as e:
              print('cordis.patch.yml 解析失败：')
              print(e)
              sys.exit(1)

          if not isinstance(doc, list) or not doc:
              print('顶层必须是非空数组（loader patch 列表）')
              sys.exit(1)
          print('cordis.patch.yml 有效，顶层 %d 条' % len(doc))

          # 顺带校验形状，防手滑：每条要么有 insert（非空数组、每项带 id），要么自己带 id
          for i, row in enumerate(doc):
              if not isinstance(row, dict):
                  print('第 %d 条不是映射' % i)
                  sys.exit(1)
              if 'insert' in row:
                  rows = row['insert']
                  if not isinstance(rows, list) or not rows:
                      print('第 %d 条的 insert 必须是非空数组' % i)
                      sys.exit(1)
                  for j, r in enumerate(rows):
                      if not isinstance(r, dict) or not r.get('id'):
                          print('第 %d 条 insert[%d] 缺 id' % (i, j))
                          sys.exit(1)
              elif not row.get('id'):
                  print('第 %d 条既没有 insert 也没有 id' % i)
                  sys.exit(1)
          print('每条的 insert / id 形状都正常')
          PY

      - name: 插件清单检查（package.json）
        run: |
          python - <<'PY'
          import json
          d = json.load(open('package.json', encoding='utf-8'))
          assert d.get('name') == 'dsh-campus-net', '包名不对'
          assert 'main' in d, '缺 main'
          assert d.get('dsh', {}).get('bundle', {}).get('patch'), '缺 dsh.bundle.patch'
          print('package.json 有效')
          PY
