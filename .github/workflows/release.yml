name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 用仓库自带的 GITHUB_TOKEN 创建 Release —— 不需要用户提供任何凭据
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确认版本号与 tag 一致
        run: |
          TAG="${{ github.ref_name }}"
          VER=$(python -c "import json;print(json.load(open('package.json',encoding='utf-8'))['version'])")
          echo "tag=$TAG  package.json=$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "tag 和 package.json 版本不一致，拒绝发布"
            exit 1
          fi

      - name: 从 tag 注释生成发布说明
        run: |
          TAG="${{ github.ref_name }}"
          # 直接从 git 读带注释 tag 的正文 —— 比 --generate-notes 可靠：
          # 首次发布没有上一个 tag 可对比，生成出来是空的。
          git fetch --tags --force
          git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
          echo "说明长度: $(wc -c < /tmp/notes.md) 字节"
          head -5 /tmp/notes.md

      - name: 创建或更新 Release
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新"
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
