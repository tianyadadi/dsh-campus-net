name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 用仓库自带的 GITHUB_TOKEN 创建 Release —— 不需要用户提供任何凭据
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 找最新 tag
        id: find
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "找到 tag: [$TAG]"

      - name: 确认版本号与 tag 一致
        if: steps.find.outputs.tag != ''
        run: |
          TAG="${{ steps.find.outputs.tag }}"
          VER=$(python -c "import json;print(json.load(open('package.json',encoding='utf-8'))['version'])")
          echo "tag=$TAG  package.json=v$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "tag 和 package.json 版本不一致，拒绝发布"
            exit 1
          fi

      - name: 同步 Release
        if: steps.find.outputs.tag != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.find.outputs.tag }}"
          # 说明优先用仓库里的 docs/release-notes/<tag>.md（可控、可审）；
          # 没有就退回读 tag 注释。
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            cp "docs/release-notes/${TAG}.md" /tmp/notes.md
            echo "说明来源: docs/release-notes/${TAG}.md"
          else
            git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
            echo "说明来源: git tag 注释"
          fi
          echo "说明长度: $(wc -c < /tmp/notes.md) 字节"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新"
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            echo "Release $TAG 不存在 → 创建"
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          fi

          echo "--- 回读确认 ---"
          gh release view "$TAG" --json tagName,body --jq '"tag=" + .tagName + " body长度=" + (.body|length|tostring)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
