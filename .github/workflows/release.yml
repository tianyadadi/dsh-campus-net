name: Release

on:
  push:
    tags:
      - 'v*'

# 用仓库自带的 GITHUB_TOKEN 创建 Release —— 不需要用户提供任何凭据
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确认版本号与 tag 一致
        run: |
          TAG="${{ github.ref_name }}"
          VER=$(python -c "import json;print(json.load(open('package.json',encoding='utf-8'))['version'])")
          echo "tag=$TAG  package.json=$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "tag 和 package.json 版本不一致，拒绝发布"
            exit 1
          fi

      - name: 创建 Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
